name: Usage question
description: Ask for help configuring or integrating the adapter.
title: ''
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Use the private security link in the issue chooser.
        Remove secrets, cookies, tokens, personal data, and private deployment details.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.6.0-next.x
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the observable outcome you want, not only the implementation you attempted.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include the smallest relevant configuration or code and the result you observed.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node, npm, OS, architecture, SvelteKit, uWebSockets.js, proxy, cluster mode, and relevant options.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I checked the README, migration guide, and existing issues first.
          required: true
        - label: This question contains no vulnerability details or sensitive data.
          required: true
