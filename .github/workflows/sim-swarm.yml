name: sim-swarm

# Deterministic-simulation seed swarm. Runs many seeded interleavings of the
# in-memory server under the fault engine and fails on any invariant violation,
# fatal, uncaught scheduler error, or determinism regression. A failing seed
# string is the entire local reproduce command: runSim({ seed: '<n>' }).

on:
  # Correctness gate on changes to the runtime, the sim, or its tests.
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/sim-swarm.js'
      - 'scripts/sim-golden.js'
      - 'scripts/verify.js'
      - 'test/dst-goldens/**'
      - 'test/**'
      - 'package.json'
      # A dependency move changes what the simulation runs, and the workflow
      # file changes what it means, so neither may pass unexamined.
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/sim-swarm.yml'
  # A deeper nightly sweep that explores far more interleavings than a PR can.
  # 04:17 UTC: off the top-of-hour stampede.
  schedule:
    - cron: '17 4 * * *'
  # Manual run with a custom seed range / knobs.
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of seeds'
        default: '2000'
      faultMode:
        description: 'Fault enablement (off | on | random)'
        default: 'random'

# Read-only: this workflow uploads the result as a build artifact and never
# writes to the repository.
permissions:
  contents: read

jobs:
  swarm:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, never a tag: `@v4` re-resolves on every
      # run, so a moved tag changes the code that checks this tree out without
      # changing anything in it. The trailing comment is the human-readable
      # release the commit is.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # One lane, published as `npm run verify:sim`, so this job and the command
      # a contributor is told to run are the same command. The lane runs the
      # seed swarm and then the golden corpus: the swarm only proves each seed
      # reproduces ITSELF, so a deterministic behaviour change sails through it
      # and the golden gate is what catches it. An intentional change is blessed
      # with `npm run sim:golden -- --update` and the corpus diff committed.
      #
      # A pull request runs a fast gate; the nightly schedule runs a deep sweep;
      # a manual dispatch uses its inputs. The lane defaults DST_COUNT only when
      # nothing set it, so the values below are kept. The job exits non-zero on
      # any failing seed.
      - name: Verify
        env:
          GIT_COMMIT: ${{ github.sha }}
          DST_COUNT: ${{ github.event_name == 'pull_request' && '300' || github.event.inputs.count || '5000' }}
          DST_FAULTS: ${{ github.event.inputs.faultMode || 'random' }}
          DST_CHECK_RATIO: '0.05'
          DST_OUT: 'sim-swarm-result.json'
        run: npm run verify:sim
      # Always upload, even on failure, so a failing sweep still leaves the
      # result JSON (with the failing seeds) for inspection.
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sim-swarm-result
          path: sim-swarm-result.json
