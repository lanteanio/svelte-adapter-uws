name: release

# Tests and packing cannot mint publication identity. The publish job only
# receives the digest-bound artifact and has no dependency installation.

on:
  push:
    tags:
      - 'svelte-adapter-uws@*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    name: bind the annotated tag before dependency execution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.identity.outputs.sha256 }}
      filename: ${{ steps.identity.outputs.filename }}
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - name: Verify tag, package, and source identity
        id: identity
        run: node scripts/prepare-release.js
      - name: Require the protected publication environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-environment.js


  tests:
    needs: identity
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  verify:
    name: verify tag identity and retain the exact tarball
    needs: [identity, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node and npm registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pinned pack CLI
        run: npm install --global --ignore-scripts npm@11.5.1

      - name: Install locked root dependencies
        run: npm ci

      - name: Verify the closed publication contract
        run: node scripts/check-release-workflow.js

      - name: Pack retained artifact
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $packJson = npm run --ignore-scripts --silent pack:release -- --destination release-artifacts
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
          $records = @($packJson | ConvertFrom-Json)
          if ($records.Count -ne 1) { throw 'npm pack did not return exactly one artifact' }
          $filename = [IO.Path]::GetFileName([string]$records[0].filename)
          if ($filename -notmatch '^[a-z0-9._-]+\.tgz$') { throw 'npm pack returned an unsafe artifact name' }
          $tarball = 'release-artifacts/' + $filename
          if (-not (Test-Path -LiteralPath $tarball -PathType Leaf)) { throw 'retained tarball is missing' }
          $sha256 = (Get-FileHash -LiteralPath $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '${{ needs.identity.outputs.sha256 }}'
          if ($expected -notmatch '^[0-9a-f]{64}$' -or $sha256 -ne $expected) { throw 'packed tarball differs from the reviewed artifact' }
          'tarball=' + $tarball >> $env:GITHUB_OUTPUT
          'filename=' + $filename >> $env:GITHUB_OUTPUT
          'sha256=' + $sha256 >> $env:GITHUB_OUTPUT

      - name: Retain exact publication artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-candidate-${{ github.run_attempt }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish the retained tarball with trusted OIDC
    needs: [identity, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up pinned Node and npm registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          registry-url: 'https://registry.npmjs.org'

      - name: Install OIDC-capable npm
        run: npm install --global --ignore-scripts npm@11.5.1

      - name: Download the retained publication artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-candidate-${{ github.run_attempt }}
          path: release-artifacts

      # download-artifact checks the artifact digest itself, but a mismatch is
      # only a warning in the run log - the job keeps going and publishes. The
      # two-job split moved the publication identity away from the test suite;
      # without this, the artifact handed between the jobs reopens the same hole
      # from the other side. Nothing but a byte comparison closes it.
      - name: Refuse to publish anything but the verified bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ needs.identity.outputs.sha256 }}'
          if ($expected -notmatch '^[0-9a-f]{64}$') { throw 'the verify job produced no usable digest' }
          $filename = '${{ needs.identity.outputs.filename }}'
          if ($filename -notmatch '^[a-z0-9._-]+\.tgz$') { throw 'refusing an unsafe artifact name' }
          $tarball = 'release-artifacts/' + $filename
          if (-not (Test-Path -LiteralPath $tarball -PathType Leaf)) { throw 'downloaded tarball is missing' }
          $actual = (Get-FileHash -LiteralPath $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'downloaded tarball is not the verified artifact' }
          'verified digest ' + $actual

      - name: Publish exact tarball to quarantine with trusted OIDC
        run: npm publish "release-artifacts/${{ needs.identity.outputs.filename }}" --tag candidate --registry=https://registry.npmjs.org --provenance
