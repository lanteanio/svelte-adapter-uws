  #               or (0 * sum without (method, outcome) (rate(http_requests_total{adapter="svelte-adapter-uws"}[1h])))
  #           )
  #             /
  #           sum without (method, outcome) (rate(http_requests_total{adapter="svelte-adapter-uws"}[1h]))
