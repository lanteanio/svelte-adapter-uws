  # rather than as live rules a fresh install would page on with an objective
  # nobody chose. The recording rules they read from
  # (adapter:http_error_ratio:rate5m, adapter:ws_message_error_ratio:rate5m)
  # are live above, so the ratios are already on your dashboard before you
  # commit to a budget.
  #
  # To enable: pick an objective, replace 0.001 below with your allowed error
  # ratio (0.001 is 99.9 percent), uncomment the group, and keep BOTH windows
  # in each expression - the short window makes the alert stop promptly once
  # the burn ends, the long window keeps a brief spike from paging. The 14.4
  # factor pages when the monthly budget would be gone in about two days.
  # Tuning guidance lives in the runbook sections the alerts link to.
