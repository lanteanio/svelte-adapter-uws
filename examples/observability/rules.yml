# Prometheus recording and alerting rules for svelte-adapter-uws.
#
# These assume you scrape `platform.metricsSnapshot()`, which returns one
# already-merged document for the whole cluster. See ./queries.md - and do NOT
# wrap these in another sum(), because the cross-worker aggregation has already
# been applied by the law each metric declares.
#
# Every alert names a section of ./runbook.md. A test in this repository fails
# if an alert points at a section that does not exist, or if a metric ships with
# neither an alert nor an explicit entry in the runbook's no-alert list - so a
# new signal cannot arrive without someone deciding whether it needs a response.
#
# Thresholds are a starting point, not a claim about your workload. The two you
# should tune first are the descriptor headroom and the upgrade reject ratio.

groups:
  - name: svelte-adapter-uws.recording
    interval: 30s
    rules:
      # Averaging per-worker ratios is not the cluster ratio, which is why the
      # adapter exports the numerator and denominator separately.
      - record: adapter:subscriber_ratio
        expr: ws_subscriptions / clamp_min(ws_connections, 1)

      # Both sides are whole-process maxima already.
      - record: adapter:fd_headroom_ratio
        expr: open_fds / clamp_min(fd_soft_limit, 1)

      - record: adapter:upgrade_reject_ratio:rate5m
        expr: |
          sum(rate(upgrade_rejected_total[5m]))
            / clamp_min(sum(rate(upgrade_admitted_total[5m])) + sum(rate(upgrade_rejected_total[5m])), 1)

      - record: adapter:pressure_sample_age_seconds
        expr: time() - pressure_sample_timestamp_seconds

  - name: svelte-adapter-uws.pipeline
    rules:
      # Trust the pipeline before you trust anything it reports.
      - alert: AdapterMetricsSnapshotDegraded
        expr: metrics_snapshot_degraded > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Metrics snapshot is one worker, not the cluster
          description: >-
            The collection did not complete, so this document reports a single worker.
            Every other alert in this file is now reading a fraction of the cluster.
          runbook_url: ./runbook.md#adaptermetricssnapshotdegraded

      - alert: AdapterMetricsSnapshotIncomplete
        expr: metrics_snapshot_workers_reporting < metrics_snapshot_workers_expected
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A worker is missing from the metrics snapshot
          description: >-
            Every summed series is understated by whatever the missing worker was carrying.
            Do not read the dip as a real drop in traffic.
          runbook_url: ./runbook.md#adaptermetricssnapshotincomplete

      - alert: AdapterPressureSamplerStalled
        expr: time() - pressure_sample_timestamp_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Pressure sampler has stopped
          description: >-
            Every sampled gauge is frozen at its last value while the target still reports up.
            Saturation, posture, connections and backpressure are all stale.
          runbook_url: ./runbook.md#adapterpressuresamplerstalled

      - alert: AdapterMetricsAbsent
        expr: absent(pressure_sample_timestamp_seconds)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Adapter metrics have disappeared
          description: >-
            The scrape target is up but the adapter's own series are gone - a metrics
            registry that stopped being configured, or a route no longer reaching it.
          runbook_url: ./runbook.md#adaptermetricsabsent

  - name: svelte-adapter-uws.capacity
    rules:
      - alert: AdapterDescriptorHeadroomLow
        expr: adapter:fd_headroom_ratio > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Approaching the file-descriptor limit
          description: New sockets fail with EMFILE at the soft limit.
          runbook_url: ./runbook.md#adapterdescriptorheadroomlow

      - alert: AdapterDescriptorHeadroomCritical
        expr: adapter:fd_headroom_ratio > 0.92
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: About to exhaust file descriptors
          description: New connections will start failing with EMFILE.
          runbook_url: ./runbook.md#adapterdescriptorheadroomlow

      - alert: AdapterProtectionSiege
        expr: protection_posture_state >= 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Protection posture is at siege
          description: New upgrades are being refused at static-serve cost.
          runbook_url: ./runbook.md#adapterprotectionsiege

      - alert: AdapterProtectionElevated
        expr: protection_posture_state == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Protection posture has been elevated for a while
          description: Sustained pressure; the waiting room is widening its retry jitter.
          runbook_url: ./runbook.md#adapterprotectionsiege

      - alert: AdapterSaturationHigh
        expr: pressure_saturation > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Worker saturation is near the configured thresholds
          description: The worst worker is at 85 percent of its pressure thresholds.
          runbook_url: ./runbook.md#adaptersaturationhigh

      - alert: AdapterHeapPressure
        expr: heap_used_ratio > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A worker isolate heap is nearly full
          description: Heap is per-isolate, so this is the worst single worker.
          runbook_url: ./runbook.md#adapterheappressure

      - alert: AdapterCpuThrottled
        expr: cpu_throttled_ratio > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The cgroup CPU quota is throttling this process
          description: A quarter of the sampled window was spent suspended by the quota.
          runbook_url: ./runbook.md#adaptercputhrottled

      - alert: AdapterBackpressureSustained
        expr: ws_backpressure_connections > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Connections are holding an outbound queue
          description: >-
            Sustained backpressure means clients are not draining as fast as you publish.
          runbook_url: ./runbook.md#adapterbackpressuresustained

      - alert: AdapterUpgradeRejectRatioHigh
        expr: adapter:upgrade_reject_ratio:rate5m > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A quarter of upgrade attempts are being refused
          description: Break it down by the reason label before acting.
          runbook_url: ./runbook.md#adapterupgraderejectratiohigh

      - alert: AdapterRateMapChurn
        expr: sum(rate(upgrade_rate_map_evicted_total[10m])) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Rate-limit maps are churning at their cap
          description: >-
            Rotating client identities are filling a limiter faster than the sweep reclaims it.
          runbook_url: ./runbook.md#adapterratemapchurn

      - alert: AdapterWaitingRoomBacklog
        expr: waiting_room_queue_depth > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Clients have been waiting to connect for a sustained period
          description: The waiting room is not draining.
          runbook_url: ./runbook.md#adapterwaitingroombacklog

  - name: svelte-adapter-uws.integrity
    rules:
      - alert: AdapterStateDivergence
        expr: increase(state_divergence_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Workers disagree about delivered state
          description: >-
            Two workers folded different state hashes for the same epoch. Clients on
            different workers are seeing different data.
          runbook_url: ./runbook.md#adapterstatedivergence

      - alert: AdapterRelayGap
        expr: increase(relay_gap_frames_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: A worker lost relayed frames its siblings received
          description: >-
            Frames were proven lost to one worker. Its clients are missing state.
          runbook_url: ./runbook.md#adapterrelaygap

      - alert: AdapterFatalAssertion
        expr: increase(framework_assertion_violations_total{severity="fatal"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: A framework invariant failed at the fatal tier
          description: A fatal assertion terminates the worker; the category label names which.
          runbook_url: ./runbook.md#adapterfatalassertion

      - alert: AdapterAssertionViolations
        expr: increase(framework_assertion_violations_total{severity="soft"}[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: A framework invariant failed at the recoverable tier
          description: Recoverable, but it indicates a state the framework did not expect.
          runbook_url: ./runbook.md#adapterfatalassertion

      - alert: AdapterResourceGrowth
        expr: increase(framework_resource_growth_suspected_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Sustained resource growth suspected
          description: The optional growth auditor saw a resource climb without plateauing.
          runbook_url: ./runbook.md#adapterresourcegrowth
