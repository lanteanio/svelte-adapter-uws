  - name: svelte-adapter-uws.meta
    rules:
      # The only expression in this file that is not per-target, on purpose:
      # if no scrape target carries the adapter label at all, every other rule
      # here evaluates over an empty set and the pack is silent. absent() is
      # the one construct that can see that state.
      - alert: AdapterTargetMissing
        expr: absent(up{adapter="svelte-adapter-uws"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: No scrape target carries the adapter label
          description: >-
            No up series carries the adapter="svelte-adapter-uws" target label,
            so every alert in this pack is evaluating an empty set. Add the
            constant label in the scrape config; see the runbook's deployment
            contract.
          runbook_url: '{{ $externalLabels.adapter_runbook_url }}#adaptertargetmissing'
