        values: '100+0x20'
      - series: 'ws_subscriptions{adapter="another-service",job="foreign",instance="one"}'
        values: '50+0x20'
      - series: 'upgrade_rate_map_evicted_total{adapter="another-service",job="foreign",instance="one",door="upgrade"}'
        values: '0+120x20'
      - series: 'waiting_room_queue_depth{adapter="another-service",job="foreign",instance="one"}'
        values: '25+0x20'
      - series: 'upgrade_admitted_total{adapter="another-service",job="foreign",instance="one"}'
        values: '0+0x20'
      - series: 'upgrade_rejected_total{adapter="another-service",job="foreign",instance="one",reason="overload"}'
        values: '0+10x20'
      - series: 'http_requests_total{adapter="another-service",job="foreign",instance="one",method="get",outcome="ok"}'
